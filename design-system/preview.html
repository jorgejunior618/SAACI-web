<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAACI · Componentes</title>
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="css/saaci.css">
<style>
  .pv-wrap { display: flex; flex-wrap: wrap; gap: 32px; padding: 32px; align-items: flex-start; }
  .pv-col { width: 390px; display: flex; flex-direction: column; gap: 16px; padding: 16px; background: var(--surface-sunken); color: var(--ink); border-radius: 16px; outline: 1px solid var(--line); }
  .pv-h { font: 500 12px/16px var(--font-sans); color: var(--ink-muted); text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 0; }
  .pv-swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .pv-sw { height: 40px; border-radius: 6px; border: 1px solid var(--line); }
  .pv-sw + small { display: block; font-size: 11px; color: var(--ink-muted); }
</style>
</head>
<body style="background:#d9d4ca">
<div class="pv-wrap">
<script>
  // Desenha a mesma coluna no tema claro e no escuro
  document.addEventListener('DOMContentLoaded', () => {
    const tpl = document.getElementById('col');
    ['light', 'dark'].forEach(t => {
      const n = tpl.content.cloneNode(true);
      n.firstElementChild.setAttribute('data-theme', t);
      n.querySelectorAll('input[type=radio]').forEach(r => r.name += '-' + t);
      document.querySelector('.pv-wrap').appendChild(n);
    });
  });
</script>
</div>

<template id="col">
<div class="pv-col">
  <p class="pv-h">Cores</p>
  <div class="pv-swatches">
    <div><div class="pv-sw" style="background:var(--surface-sunken)"></div><small>surface-sunken</small></div>
    <div><div class="pv-sw" style="background:var(--surface)"></div><small>surface</small></div>
    <div><div class="pv-sw" style="background:var(--brand)"></div><small>brand</small></div>
    <div><div class="pv-sw" style="background:var(--progress)"></div><small>progress</small></div>
    <div><div class="pv-sw" style="background:var(--warning)"></div><small>warning</small></div>
    <div><div class="pv-sw" style="background:var(--danger)"></div><small>danger</small></div>
    <div><div class="pv-sw" style="background:var(--brand-soft)"></div><small>brand-soft</small></div>
    <div><div class="pv-sw" style="background:var(--ink)"></div><small>ink</small></div>
  </div>

  <p class="pv-h">Total</p>
  <section class="sa-card sa-total" aria-label="Seu total de horas" style="padding:20px 16px 16px">
    <span class="sa-hero">61h</span>
    <p class="sa-total-label">Faltam para completar suas horas</p>
    <div class="sa-bar sa-bar-lg" role="progressbar" aria-valuemin="0" aria-valuemax="120" aria-valuenow="59" aria-label="59 de 120 horas"><span style="width:49.2%"></span></div>
    <div class="sa-total-meta"><span>59h feitas</span><span>meta de 120h</span></div>
  </section>

  <p class="pv-h">Cartão de item</p>
  <a class="sa-card sa-cat" href="#">
    <span class="sa-cat-head"><span class="sa-cat-titles"><span class="sa-cat-n">Item 7</span><span class="sa-cat-name">Curso na área de engenharia de computação</span></span><svg class="sa-icon sa-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
    <span class="sa-cat-hours"><b>18,0h</b><span>de 60h</span></span>
    <span class="sa-bar" aria-hidden="true"><span style="width:30%"></span></span>
    <span class="sa-cat-foot">Ainda cabem 42,0h</span>
  </a>
  <a class="sa-card sa-cat sa-cat-full" href="#">
    <span class="sa-cat-head"><span class="sa-cat-titles"><span class="sa-cat-n">Item 13</span><span class="sa-cat-name">Ouvinte em palestras da área do curso</span></span><svg class="sa-icon sa-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
    <span class="sa-cat-hours"><b>30,0h</b><span>de 30h</span></span>
    <span class="sa-bar" aria-hidden="true"><span style="width:100%"></span></span>
    <span class="sa-cat-foot">Completo. 4,0h registradas não contam</span>
  </a>

  <p class="pv-h">Botões</p>
  <button class="sa-btn sa-btn-primary sa-btn-block" type="button">Registrar</button>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <button class="sa-btn sa-btn-secondary" type="button">Escolher outro</button>
    <button class="sa-btn sa-btn-tertiary" type="button">Trocar</button>
  </div>
  <button class="sa-btn sa-btn-primary sa-btn-block" type="button" aria-busy="true"><span class="sa-spinner" aria-hidden="true"></span>Registrando</button>
  <button class="sa-btn sa-btn-primary sa-btn-block" type="button" disabled>Registrar</button>
  <button class="sa-btn sa-btn-danger sa-btn-block" type="button">Remover atividade</button>

  <p class="pv-h">Badges e avisos</p>
  <div class="sa-row"><span class="sa-badge sa-badge-conta">Conta</span><span class="sa-badge sa-badge-parcial">Conta em parte</span><span class="sa-badge sa-badge-naoconta">Não conta</span></div>
  <div class="sa-notice sa-notice-success" role="status"><p class="sa-notice-title">Você completou o item 13</p><p class="sa-notice-body">Ainda dá para somar nos itens 6, 7 e 12.</p></div>
  <div class="sa-notice sa-notice-danger" role="alert"><p class="sa-notice-title">Falta corrigir 2 coisas</p><ul><li><a href="#">Digite as horas que aparecem no certificado</a></li><li><a href="#">Digite a data em que a atividade terminou</a></li></ul></div>

  <p class="pv-h">Painel de regra</p>
  <section class="sa-rule">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px"><p class="sa-rule-head">Item 13 · Palestra como ouvinte</p><button class="sa-link" type="button" style="font-size:14px">Trocar item</button></div>
    <p class="sa-rule-text">Cada palestra conta 2h, não importa quantas horas ela durou.</p>
    <div class="sa-rule-fit"><span>Ainda cabem <b class="sa-num">4,0h</b> neste item</span><span class="sa-support sa-num">26h de 30h</span></div>
    <div class="sa-bar"><span style="width:86.7%"></span></div>
    <table class="sa-calc"><caption>Quanto essa atividade vai contar</caption><tbody><tr><th scope="row">3 palestras × 2h</th><td>6,0h</td></tr><tr><th scope="row">Cabem neste item</th><td>4,0h</td></tr></tbody><tfoot><tr><th scope="row">Vai contar</th><td>4,0h</td></tr></tfoot></table>
    <p class="sa-inline sa-inline-warning">Essa atividade vale 6,0h, mas só cabem mais 4,0h neste item.</p>
  </section>

  <p class="pv-h">Campos</p>
  <div class="sa-field sa-field-read"><div class="sa-label-row"><label class="sa-label" for="a">Nome da atividade</label><span class="sa-flag">Lido do certificado, confira</span></div><input class="sa-input" id="a" value="Curso de React com TypeScript"></div>
  <div class="sa-field sa-field-error"><label class="sa-label" for="b">Data em que a atividade terminou</label><p class="sa-error" id="be">Digite no formato dd/mm/aaaa, por exemplo 12/09/2026.</p><input class="sa-input" id="b" placeholder="dd/mm/aaaa" aria-invalid="true" aria-describedby="be"></div>
  <fieldset class="sa-choices"><legend>A palestra foi avulsa ou fez parte de um evento?</legend><div class="sa-choices-list">
    <label class="sa-choice"><input type="radio" name="ev" checked><span class="sa-choice-text">Foi avulsa<small>Conta neste item, 2h por palestra</small></span></label>
    <label class="sa-choice"><input type="radio" name="ev"><span class="sa-choice-text">Fez parte de um evento<small>Conta pelo item 12, por dia de evento</small></span></label>
  </div></fieldset>
  <fieldset class="sa-seg" aria-label="Tema"><label><input type="radio" name="tm" checked>Automático</label><label><input type="radio" name="tm">Claro</label><label><input type="radio" name="tm">Escuro</label></fieldset>
  <ul class="sa-pw-rules"><li class="sa-pw-rule sa-pw-rule-ok">Uma letra e um número</li><li class="sa-pw-rule">Pelo menos 8 caracteres, faltam 2</li></ul>

  <p class="pv-h">Lista de atividades</p>
  <ul class="sa-list">
    <li class="sa-act"><a class="sa-act-main" href="#"><span class="sa-act-name">Curso de Git e GitHub</span><span class="sa-act-meta">8,0h<span class="sa-dot">·</span>03/05/2025</span></a><svg class="sa-icon sa-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></li>
    <li class="sa-act"><a class="sa-act-main" href="#"><span class="sa-act-name">Palestra de boas-vindas aos calouros</span><span class="sa-act-meta"><span class="sa-act-naoconta">Não conta</span><span class="sa-dot">·</span>antes do seu ingresso</span></a><svg class="sa-icon sa-icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></li>
  </ul>

  <p class="pv-h">Barra inferior</p>
  <nav class="sa-nav" aria-label="Principal" style="position:static">
    <a href="#" aria-current="page"><svg class="sa-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20h-5v-5.5h-6V20H4z"/></svg>Início</a>
    <a href="#"><svg class="sa-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11"/><path d="M4 18h2"/></svg>Atividades</a>
    <a href="#"><span class="sa-nav-fab"><svg class="sa-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>Registrar</a>
    <a href="#"><svg class="sa-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="2"/><path d="M8 3.5v4M16 3.5v4M4 10.5h16"/></svg>Eventos</a>
    <a href="#"><svg class="sa-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.4 3.6-5 7-5s6.2 1.6 7 5"/></svg>Perfil</a>
  </nav>
</div>
</template>
</body>
</html>
