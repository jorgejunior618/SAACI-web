name: Melhoria
description: Sugira uma funcionalidade nova ou uma mudança.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qual problema isso resolve
      description: Quem é afetado (aluno, coordenação) e em que situação.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: O que você imagina. Telas novas são especificadas e validadas pela equipe.
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
