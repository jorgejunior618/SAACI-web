version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # 0 desliga os PRs de versão nova: o Dependabot só abre PR de vulnerabilidade (alerta de
    # segurança), que tem limite próprio e não depende deste número. As versões novas aparecem
    # na issue semanal de .github/workflows/dependencias.yml, e o time atualiza em lote
    # (`pnpm up --latest`). Motivo: um PR por grupo mexe no pnpm-lock.yaml, os PRs conflitam
    # entre si e a branch de cada um fica no repositório.
    open-pull-requests-limit: 0
    # Gera "chore(deps): ..." e "chore(deps-dev): ...", no padrão de commit do projeto.
    commit-message:
      prefix: chore
      include: scope
    # O typescript-eslint ainda não suporta o TypeScript 7 (doc/tecnologia.md).
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
