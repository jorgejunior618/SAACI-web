name: Apagar branch

# Apaga a branch de um PR depois que ele é mergeado. Faz o papel da opção "Automatically delete head
# branches" das Settings, que quem mantém o projeto pode não alcançar.
#
# `pull_request_target` e não `pull_request`: o PR do Dependabot recebe token só de leitura no
# segundo. Aqui o workflow é o da `main`, nunca o da branch do PR, e nenhum código do PR é baixado
# nem executado. O nome da branch entra por variável de ambiente, nunca colado no script.
# Só vale depois que este arquivo estiver na main.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  apagar:
    name: Apagar a branch do PR mergeado
    # Só PR mergeado, só branch deste repositório (não de fork) e nunca a branch principal.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      # A branch pode já ter sido apagada (`gh pr merge --delete-branch`, ou o botão do PR).
      - name: Apagar a branch
        run: |
          if gh api "repos/$REPO/git/ref/heads/$BRANCH" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH"
            echo "Branch $BRANCH apagada."
          else
            echo "Branch $BRANCH já não existe."
          fi
